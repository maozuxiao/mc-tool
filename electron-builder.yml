appId: com.streamax.mcquery
productName: MC物料查询
copyright: Copyright © 2026 Sean Mao
# 应用/文件版本号（四位，区别于 package.json 三段产品版本）
buildVersion: 1.0.57.0

directories:
  output: dist
  buildResources: build

# 应用图标（PNG/SVG，electron-builder 会自动转换）
icon: build/icon.png

files:
  - out/**/*
  # 排除开发依赖，减小体积
  - '!**/node_modules/.cache/**'
  - '!**/*.map'

# 把图标作为额外资源放到 resources/ 下（asar 外），避免路径解析问题
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/skills/mc-material-query-local
    to: skills/mc-material-query-local
  # 内置技能：鸿翼文件系统查询与原始文件下载（1.0.43）。只有 SKILL.md + references，
  # 执行层在主进程（src/main/ai/wjxtSkill.ts），不随包分发脚本或运行时。
  - from: resources/skills/wjxt-file-download
    to: skills/wjxt-file-download
  # 内置技能：Ceiba2 / WCMS5 API 报错排查（1.0.48）。纯文档技能（SKILL.md + references），
  # 无脚本、无运行时依赖。⚠️ 新增内置技能时**必须**在这里补一条 —— 否则技能只在开发目录可见，
  # 安装版 Skills 面板里根本不会出现（1.0.48 提测时才发现漏配，见 Release Notes）。
  - from: resources/skills/ceiba2-api-qa
    to: skills/ceiba2-api-qa
  # 内置技能：钉钉 DEAP 知识库问答（1.0.50）。随包分发的是 **runtime 源码**
  #（src/ + package.json + package-lock.json，约 95KB），**不含 node_modules**。
  # 依赖由用户在「MCP 服务 → 一键准备依赖」时按需安装（playwright 约 28MB），
  # 这样安装包体积基本不变，也让「依赖装在哪」由用户数据目录决定 ——
  # 依赖一旦装进本目录，下次更新时会被新包覆盖（下面的 filter 排除了 node_modules），
  # 用户就得重装一次（1.0.52 修掉的正是这个）。
  # ⚠️ 因此这个目录**不能直接运行**：它必须先经「一键准备依赖」复制到 userData
  # 的可写副本并装好依赖，登记的 cwd 才会切到那个副本。
  # 对照file-office-local（下面那条）：它的 node_modules 是**随包分发**的、不受更新影响，
  # 所以**不能**迁移 —— mcpClient.prepareWritableRuntime 的第一条判据就是
  # 「目录里有没有 node_modules」，两者刻意相反，改动时务必一起看。
  - from: resources/skills/tech-agent-skill
    to: skills/tech-agent-skill
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/node_modules/**'
  # 文件读写技能（AI Build 模式）：随包分发，含自带的 node_modules。
  # 依赖全部为纯 JS（已验证 0 个 .node），因此不需要 asarUnpack。
  # filter 用于瘦身：source map 与 TS 类型定义运行时用不到，合计约 34MB。
  - from: resources/skills/file-office-local
    to: skills/file-office-local
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/node_modules/@types/**'
      - '!**/node_modules/**/tsconfig.json'
      # 瘦身：pptxgenjs 仍未启用（生成 pptx 尚未实现），从安装包中剔除。
      # ⚠️ docx 必须随包分发：1.0.46 起 file_write 写 .docx 与 translate_docx 都用它，
      # 这里曾经把 docx 也剔掉（当时生成能力未启用），导致**安装版报「生成 docx 需要 docx 依赖」**，
      # 而开发目录能跑——排查时先看本文件有没有把它排除掉。
      # 注意：exceljs 与 @fast-csv 也必须随包分发——update 模式用它保留原 xlsx 样式。
      - '!**/node_modules/pptxgenjs/**'
      - '!**/node_modules/test/**'
      - '!**/node_modules/tests/**'

# 启用 asar 打包（减小体积 + 加快加载）
asar: true

# 压缩级别（最高压缩减小 exe 体积）
compression: maximum

win:
  target:
    - nsis
    - portable
  # 产物名固定用 ASCII，且**不带 -${arch}**（1.0.52 补）。
  # 原因：electron-updater 的 `latest.yml` 里记录的是规范化后的 ASCII 名
  # （`mc-material-query-setup-<ver>.exe`），而 NSIS 默认用 productName 拼出
  # 「MC物料查询 Setup <ver>.exe」—— 两者不一致时，自动更新会去下载一个
  # Release 上并不存在的文件名而失败。历史 Release 的附件名也一直是 ASCII，
  # 在这里固化下来，就不必每次发布后手工改名对齐。
  artifactName: mc-material-query-${version}.${ext}
  # 当前无原生模块依赖，无需解包（保持 asar 压缩）。
  # 若以后引入 .node 依赖，必须在此配置 asarUnpack——原生模块无法从 asar 内部加载。
  asarUnpack: []

mac:
  target:
    - dmg
  artifactName: MC物料查询-${version}-${arch}.${ext}
  category: public.app-category.business

nsis:
  # 安装包名必须与 `latest.yml` 里记录的一致，否则自动更新下载不到文件（见 win.artifactName 注释）
  artifactName: mc-material-query-setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MC物料查询
  # 安装过程默认展开详细信息日志（见 build/installer.nsh）
  include: build/installer.nsh

publish:
  - provider: github
    owner: maozuxiao
    repo: mc-tool
